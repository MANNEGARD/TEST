configuration:
  domain:
    name: "Domain"
    description: "The address DriveLog is served on, e.g. drivelog.example.com. It must point to your home's public IP address."
  admin_email:
    name: "Administrator e-mail"
    description: "The administrator account (your login). The account is only created from here; without an account nothing is exposed to the internet."
  admin_password:
    name: "Administrator password"
    description: "Fill in to create the account the first time or to reset a forgotten password: enter a new one, save and restart the app. Otherwise preferably leave it empty. At least 12 characters."
  strato_dyndns:
    name: "STRATO DynDNS"
    description: "Keep the domain's address up to date at STRATO (your STRATO package must include DynDNS). Off: the A record is set by hand or by your router – the app then checks every 15 minutes that the domain leads here and tells you if it stops doing so."
  strato_dyndns_user:
    name: "STRATO user name"
    description: "The domain in your STRATO package, e.g. example.com. Leave empty if STRATO DynDNS is off."
  strato_dyndns_password:
    name: "STRATO DynDNS password"
    description: "The DynDNS password set at STRATO."
  log_level:
    name: "Log level"
    description: "How much the app's start program and the API write to the log."
network:
  80/tcp: "HTTP – certificate validation and redirect to HTTPS"
  443/tcp: "HTTPS – DriveLog"
  443/udp: "HTTP/3 (QUIC)"
