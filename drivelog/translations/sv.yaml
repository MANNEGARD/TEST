configuration:
  domain:
    name: "Domän"
    description: "Adressen DriveLog ska nås på, t.ex. drivelog.smgd.se. Domänen måste peka på hemmets publika IP-adress."
  admin_email:
    name: "Administratörens e-post"
    description: "Administratörskontot (blir inloggningen). Kontot skapas bara härifrån; utan konto öppnas ingenting mot internet."
  admin_password:
    name: "Administratörens lösenord"
    description: "Fyll i för att skapa kontot första gången eller för att återställa ett glömt lösenord: skriv ett nytt, spara och starta om appen. Lämna gärna tomt annars. Minst 12 tecken."
  strato_dyndns:
    name: "STRATO DynDNS"
    description: "Låt appen hålla domänens adress hos STRATO uppdaterad (DynDNS måste ingå i STRATO-paketet). Av: A-posten sätts för hand eller av routern – appen kontrollerar då var 15:e minut att domänen leder hit och säger till om den slutar göra det."
  strato_dyndns_user:
    name: "STRATO-användarnamn"
    description: "Domänen i ditt STRATO-paket, t.ex. smgd.se. Lämna tomt om STRATO DynDNS är av."
  strato_dyndns_password:
    name: "STRATO DynDNS-lösenord"
    description: "DynDNS-lösenordet du satt hos STRATO (Sicherheit → Passwörter festlegen)."
  log_level:
    name: "Loggnivå"
    description: "Hur mycket appens startprogram och API:t skriver i loggen."
  extra_domains:
    name: "Extra domäner"
    description: "Fler tjänster på samma server: en rad per domän, t.ex. transcribe.smgd.se=transcribe:8080. Appen hämtar certifikat för domänen och skickar vidare till värden och porten. Värden är den andra tjänstens container – inte localhost eller en IP-adress. Domänen måste peka hit. Lämna tomt annars."
network:
  80/tcp: "HTTP – certifikatkontroll och vidarekoppling till HTTPS"
  443/tcp: "HTTPS – DriveLog"
  443/udp: "HTTP/3 (QUIC)"
