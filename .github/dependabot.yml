# Föreslår uppdateringar av de fästa versionerna (commit-SHA för Actions, digest för bas-avbilder).
# Varje förslag blir en vanlig ändring som går igenom CI och provstarten innan den kan slås ihop.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /drivelog
      - /backend
      - /frontend
    schedule:
      interval: weekly
