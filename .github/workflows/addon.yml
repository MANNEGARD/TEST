# Home Assistant-tillägget (drivelog/): tester, bygge för amd64 och aarch64, provstart som
# Supervisor skulle göra – och på standardgrenen publicering av avbilden till GHCR.
#
# Actions är fästa vid commit-SHA (versionen står som kommentar).
#
# Utgivning: ändra drivelog/VERSION (och CHANGELOG.md). Home Assistant läser däremot `version` ur
# drivelog/config.yaml på standardgrenen och hämtar avbilden med den taggen – därför höjs
# config.yaml av sista jobbet här, först när avbilden bevisligen finns på GHCR. Home Assistant
# erbjuds alltså aldrig en version som inte går att hämta, inte ens om ett bygge misslyckas.
name: Home Assistant-tillägg

on:
  push:
    # Bara repots egna grenar – inte tillfälliga grenar från andra verktyg.
    branches:
      - main
      - "claude/relaxed-galileo-k3i0cz"
    paths:
      - "drivelog/**"
      - "repository.yaml"
      - "backend/**"
      - "frontend/**"
      - "deploy/smoke-test.sh"
      - "deploy/server.sh"
      - ".github/workflows/addon.yml"
      - ".github/scripts/**"
      - "custom_components/**"
      - "hacs.json"
  workflow_dispatch:

concurrency:
  group: addon-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tester:
    name: Tillägget – tester och YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Installera
        run: python -m pip install pytest pyyaml cryptography
      - name: Tester (startprogram, nycklar, Caddyfile, DynDNS, YAML)
        run: python -m pytest drivelog/tests -q -p no:cacheprovider
      - name: Utgåvans text för HACS går att ta fram (utan nätverk)
        run: python3 .github/scripts/utgava.py --anteckningar

  amd64:
    name: amd64 – bygg och provstarta som Supervisor
    needs: tester
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Läs versionen som byggs ur drivelog/VERSION
        id: meta
        run: echo "version=$(python3 .github/scripts/erbjud_version.py --visa)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Bygg avbilden (linux/amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: drivelog/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: drivelog-addon:test
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=addon-amd64
          cache-to: type=gha,mode=max,scope=addon-amd64

      - name: Etiketter som Supervisor läser
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          label() { docker inspect -f "{{ index .Config.Labels \"$1\" }}" drivelog-addon:test; }
          test "$(label io.hass.type)" = addon
          test "$(label io.hass.arch)" = amd64
          test "$(label io.hass.version)" = "$VERSION"
          test "$(label org.opencontainers.image.source)" = https://github.com/SMGD-MP/TEST

      - name: Slumpa lösenord för testkontot
        run: |
          # Första lösenordet, det som återställs via inställningarna och det som byts via API:t.
          for namn in CI_ADMIN_PASSWORD CI_NYTT_PASSWORD CI_BYTT_PASSWORD; do
            pw="$(openssl rand -hex 16)"
            echo "::add-mask::$pw"
            echo "$namn=$pw" >> "$GITHUB_ENV"
          done

      - name: Hjälpfunktioner
        run: |
          cat > "$RUNNER_TEMP/addon.sh" <<'EOF'
          # Skriver options.json i volymen, som Supervisor gör före varje start.
          skriv_options() { # volym, lösenord: 0 = tomma fält, annars namnet på miljövariabeln med lösenordet
            python3 - "$2" > "$RUNNER_TEMP/options.json" <<'PY'
          import json, os, sys
          # Som Supervisor skriver den med standardvärdena i config.yaml: tomma fält är "".
          o = {"domain": "localhost", "admin_email": "", "admin_password": "", "strato_dyndns": False,
               "strato_dyndns_user": "", "strato_dyndns_password": "", "log_level": "info"}
          if sys.argv[1] != "0":
              o.update(admin_email="ci@example.com", admin_password=os.environ[sys.argv[1]])
          print(json.dumps(o))
          PY
            docker run --rm -v "$1:/data" -v "$RUNNER_TEMP/options.json:/in.json:ro" --entrypoint cp \
              drivelog-addon:test /in.json /data/options.json
            rm -f "$RUNNER_TEMP/options.json"
          }
          # Startar tillägget som Supervisor: egen init, /data som volym, 80/443 publicerade.
          starta() { # namn, volym
            docker run -d --name "$1" --init -e TZ=Europe/Stockholm -v "$2:/data" \
              -p 80:80 -p 443:443 -p 443:443/udp drivelog-addon:test >/dev/null
          }
          vanta_pa_https() {
            for _ in $(seq 1 150); do
              curl -kfsS -o /dev/null https://localhost/api/v1/health/ready 2>/dev/null && return 0
              sleep 2
            done
            echo "DriveLog svarade inte via https://localhost" >&2; return 1
          }
          vanta_pa_logg() { # namn, text
            for _ in $(seq 1 150); do
              docker logs "$1" 2>&1 | grep -F "$2" >/dev/null && return 0
              [ "$(docker inspect -f '{{.State.Running}}' "$1")" = true ] || { echo "$1 har stannat" >&2; return 1; }
              sleep 2
            done
            echo "Hittade inte '$2' i loggen" >&2; return 1
          }
          # Inloggning genom proxyn; skriver HTTP-koden och sparar svaret (med en andra parameter även kakan).
          logga_in() { # lösenord [kakfil]
            curl -ksS -o "$RUNNER_TEMP/inloggning.json" -w '%{http_code}' ${2:+-c "$2"} \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"ci@example.com\",\"password\":\"$1\"}" https://localhost/api/v1/auth/login
          }
          stoppa() { # namn
            docker stop -t 30 "$1" >/dev/null
            test "$(docker inspect -f '{{.State.ExitCode}}' "$1")" = 0 || { echo "Nedstängningen gav inte kod 0" >&2; return 1; }
            docker rm "$1" >/dev/null
          }
          fingeravtryck() { docker exec "$1" sh -c 'cat /data/hemligheter/secret_key /data/hemligheter/encryption_keys | sha256sum'; }
          # Kör Python i en ANNAN container på samma Docker-nät – som ett annat tillägg på
          # Home Assistants interna nät (hassio). Avbilden återanvänds; inget mer hämtas.
          annan_container() { # python-kod, argument …
            kod="$1"; shift
            docker run --rm --entrypoint python3 drivelog-addon:test -I -c "$kod" "$@"
          }
          EOF

      - name: Första start med administratörsuppgifter
        run: |
          . "$RUNNER_TEMP/addon.sh"
          docker volume create drivelog-data >/dev/null
          skriv_options drivelog-data CI_ADMIN_PASSWORD
          starta drivelog drivelog-data
          vanta_pa_https
          docker logs drivelog 2>&1 | grep -F "Lösenordet för ci@example.com sattes från appens inställningar."
          # domain=localhost: ingen adressvakt (den gäller bara en riktig domän utan DynDNS).
          docker logs drivelog 2>&1 | grep -F "STRATO DynDNS är avslaget"
          if docker logs drivelog 2>&1 | grep -F "Adressvakten" >/dev/null; then echo "Adressvakten startade för localhost" >&2; exit 1; fi

      - name: Röktest genom proxyn (HTTPS)
        env:
          SMOKE_EMAIL: ci@example.com
          SMOKE_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
        run: deploy/smoke-test.sh https://localhost

      - name: Nycklar, rättigheter, användare och portar
        run: |
          . "$RUNNER_TEMP/addon.sh"
          # Nycklarna maskeras innan något kan skrivas ut, och får inte finnas i loggen.
          for f in secret_key encryption_keys; do
            v="$(docker exec drivelog cat "/data/hemligheter/$f")"
            echo "::add-mask::$v"
            if docker logs drivelog 2>&1 | grep -F "$v" >/dev/null; then echo "$f finns i loggen" >&2; exit 1; fi
          done
          if docker logs drivelog 2>&1 | grep -F "$CI_ADMIN_PASSWORD" >/dev/null; then echo "Lösenordet finns i loggen" >&2; exit 1; fi
          # Lagringslayouten i /data (drivelog_addon/startprogram.py): /data ägs av root, API:t och
          # Caddy har var sin egen katalog, nycklarna och options.json kan bara root läsa.
          docker exec drivelog stat -c '%a %U %n' /data /data/options.json /data/hemligheter /data/hemligheter/secret_key \
            /data/hemligheter/encryption_keys /data/app /data/app/drivelog.sqlite3 /data/caddy
          test "$(docker exec drivelog stat -c '%a %U' /data)" = "711 root"
          test "$(docker exec drivelog stat -c '%a %U' /data/options.json)" = "600 root"
          test "$(docker exec drivelog stat -c '%a %U' /data/hemligheter)" = "700 root"
          test "$(docker exec drivelog stat -c '%a %U' /data/hemligheter/secret_key)" = "600 root"
          test "$(docker exec drivelog stat -c '%a %U' /data/hemligheter/encryption_keys)" = "600 root"
          test "$(docker exec drivelog stat -c '%a %U' /data/app)" = "700 drivelog"
          test "$(docker exec drivelog stat -c '%U' /data/app/drivelog.sqlite3)" = "drivelog"
          test "$(docker exec drivelog stat -c '%a %U' /data/caddy)" = "700 caddy"
          # Märket över senast tillämpade administratörslösenord: bara root, aldrig lösenordet.
          test "$(docker exec drivelog stat -c '%a %U' /data/hemligheter/admin_losenord_marke)" = "600 root"
          docker exec drivelog grep -qE '^v1:[0-9a-f]{64}$' /data/hemligheter/admin_losenord_marke
          if docker exec drivelog grep -rF "$CI_ADMIN_PASSWORD" /data/hemligheter /data/app >/dev/null 2>&1; then
            echo "Lösenordet finns i klartext i /data" >&2; exit 1
          fi
          if docker exec drivelog sh -c 'ls /data/*.sqlite3' 2>/dev/null; then echo "Databasen ligger direkt i /data" >&2; exit 1; fi
          # API-användaren kan inte flytta, ersätta eller skapa något direkt i /data.
          docker exec -u drivelog drivelog python3 -I - <<'EOF'
          import os
          for forsok in (lambda: os.rename("/data/options.json", "/data/x"),
                         lambda: os.rename("/data/hemligheter", "/data/y"),
                         lambda: open("/data/ny-fil", "w"),
                         lambda: open("/data/options.json"),
                         lambda: open("/data/hemligheter/secret_key")):
              try:
                  forsok()
              except PermissionError:
                  continue
              raise SystemExit("API-användaren kunde ändra i /data")
          print("API-användaren når bara /data/app")
          EOF
          # API, webbapp och Caddy körs som icke-root.
          docker exec drivelog python3 - <<'EOF'
          import os
          hittade = {}
          for pid in filter(str.isdigit, os.listdir("/proc")):
              try:
                  cmd = open(f"/proc/{pid}/cmdline", "rb").read().replace(b"\0", b" ").decode()
                  uid = next(l.split()[1] for l in open(f"/proc/{pid}/status") if l.startswith("Uid:"))
              except OSError:
                  continue
              for namn in ("uvicorn", "server.js", "caddy run"):
                  if namn in cmd:
                      hittade[namn] = uid
          print(hittade)
          assert set(hittade) == {"uvicorn", "server.js", "caddy run"}, hittade
          assert all(uid != "0" for uid in hittade.values()), hittade
          EOF
          # API:t (8000) publiceras inte på värden men nås på containerns nät (som från Home Assistant).
          if curl -fsS --max-time 3 http://127.0.0.1:8000/api/v1/health 2>/dev/null; then echo "8000 är publicerad" >&2; exit 1; fi
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' drivelog)"
          curl -fsS --max-time 5 "http://$ip:8000/api/v1/health/ready"; echo
          # Webbappen lyssnar bara på 127.0.0.1 i containern.
          if curl -fsS --max-time 3 "http://$ip:3000/api/healthz" 2>/dev/null; then echo "Webbappen nås utanför containern" >&2; exit 1; fi
          fingeravtryck drivelog > "$RUNNER_TEMP/nycklar-1"

      - name: Port 8000 från en annan container – inget konto via setup, ingen förfalskad IP
        run: |
          . "$RUNNER_TEMP/addon.sh"
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' drivelog)"
          # 1) POST /api/v1/auth/setup avvisas (tillägget skapar kontot bara ur inställningarna).
          # 2) En förfalskad X-Forwarded-For kringgår inte inloggningsspärren per IP: API:t litar bara
          #    på rubriken från Caddy (FORWARDED_ALLOW_IPS=127.0.0.1), så alla försök räknas på
          #    containerns riktiga adress och spärren (429) slår till.
          annan_container '
          import json, sys, urllib.error, urllib.request
          bas = f"http://{sys.argv[1]}:8000/api/v1"
          def post(sokvag, data, rubriker=None):
              req = urllib.request.Request(bas + sokvag, data=json.dumps(data).encode(), method="POST",
                                           headers={"Content-Type": "application/json", **(rubriker or {})})
              try:
                  with urllib.request.urlopen(req, timeout=15) as svar:
                      return svar.status, svar.read().decode()
              except urllib.error.HTTPError as fel:
                  return fel.code, fel.read().decode()
          status, text = post("/auth/setup", {"email": "inkraktare@example.com", "password": "x" * 20})
          print("setup:", status, text)
          assert status == 403 and "setup_disabled" in text, (status, text)
          koder = [post("/auth/login", {"email": f"okand{i}@example.com", "password": "fel-losenord-123"},
                        {"X-Forwarded-For": f"10.0.{i}.1"})[0] for i in range(15)]
          print("inloggningsförsök:", koder)
          assert 429 in koder, "förfalskad X-Forwarded-For kringgick spärren"
          ' "$ip"

      - name: Omstart med samma /data behåller konto och nycklar
        env:
          SMOKE_EMAIL: ci@example.com
          SMOKE_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
        run: |
          . "$RUNNER_TEMP/addon.sh"
          stoppa drivelog
          # Utan administratörsuppgifter: webbappen startar bara om kontot finns kvar i databasen.
          skriv_options drivelog-data 0
          starta drivelog drivelog-data
          vanta_pa_https
          fingeravtryck drivelog > "$RUNNER_TEMP/nycklar-2"
          cmp -s "$RUNNER_TEMP/nycklar-1" "$RUNNER_TEMP/nycklar-2" || { echo "Nycklarna ändrades vid omstart" >&2; exit 1; }
          if docker logs drivelog 2>&1 | grep -F "skapades och sparades" >/dev/null; then echo "Nycklar skapades på nytt" >&2; exit 1; fi
          deploy/smoke-test.sh https://localhost

      - name: Glömt lösenord – ett ÄNDRAT lösenord i inställningarna återställer det
        run: |
          . "$RUNNER_TEMP/addon.sh"
          # En inloggad session före återställningen ska avslutas av den.
          test "$(logga_in "$CI_ADMIN_PASSWORD" "$RUNNER_TEMP/kaka-fore")" = 200
          stoppa drivelog
          skriv_options drivelog-data CI_NYTT_PASSWORD
          starta drivelog drivelog-data
          vanta_pa_https
          docker logs drivelog 2>&1 | grep -F "Lösenordet för ci@example.com sattes från appens inställningar."
          test "$(logga_in "$CI_NYTT_PASSWORD")" = 200 || { echo "Det nya lösenordet fungerar inte" >&2; exit 1; }
          test "$(logga_in "$CI_ADMIN_PASSWORD")" = 401 || { echo "Det gamla lösenordet fungerar fortfarande" >&2; exit 1; }
          kod="$(curl -ksS -o /dev/null -w '%{http_code}' -b "$RUNNER_TEMP/kaka-fore" https://localhost/api/v1/auth/me)"
          test "$kod" = 401 || { echo "Sessionen från före återställningen gäller fortfarande ($kod)" >&2; exit 1; }
          for pw in "$CI_ADMIN_PASSWORD" "$CI_NYTT_PASSWORD"; do
            if docker logs drivelog 2>&1 | grep -F "$pw" >/dev/null; then echo "Ett lösenord finns i loggen" >&2; exit 1; fi
          done

      - name: Oförändrat fält skriver inte över ett lösenord som bytts i DriveLog
        run: |
          . "$RUNNER_TEMP/addon.sh"
          # Ägaren byter lösenord inne i DriveLog (samma anrop som webbappen gör).
          test "$(logga_in "$CI_NYTT_PASSWORD" "$RUNNER_TEMP/kaka")" = 200
          csrf="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["csrf_token"])' "$RUNNER_TEMP/inloggning.json")"
          kod="$(curl -ksS -o /dev/null -w '%{http_code}' -b "$RUNNER_TEMP/kaka" -H "X-CSRF-Token: $csrf" \
            -H 'Content-Type: application/json' \
            -d "{\"current_password\":\"$CI_NYTT_PASSWORD\",\"new_password\":\"$CI_BYTT_PASSWORD\"}" \
            https://localhost/api/v1/auth/change-password)"
          test "$kod" = 204 || { echo "Lösenordsbytet via API:t gav $kod" >&2; exit 1; }
          # Omstart med SAMMA options.json (fältet innehåller fortfarande CI_NYTT_PASSWORD).
          stoppa drivelog
          starta drivelog drivelog-data
          vanta_pa_https
          docker logs drivelog 2>&1 | grep -F "är oförändrat sedan det senast tillämpades"
          if docker logs drivelog 2>&1 | grep -F "sattes från appens inställningar" >/dev/null; then
            echo "Lösenordet sattes igen trots oförändrat fält" >&2; exit 1
          fi
          test "$(logga_in "$CI_BYTT_PASSWORD")" = 200 || { echo "Det bytta lösenordet gäller inte längre" >&2; exit 1; }
          test "$(logga_in "$CI_NYTT_PASSWORD")" = 401 || { echo "Fältets lösenord skrev över det bytta" >&2; exit 1; }

      - name: För kort lösenord i inställningarna – DriveLog startar ändå, lösenordet ändras inte
        run: |
          . "$RUNNER_TEMP/addon.sh"
          stoppa drivelog
          export CI_KORT_PASSWORD=kort-lösen
          skriv_options drivelog-data CI_KORT_PASSWORD
          starta drivelog drivelog-data
          vanta_pa_https
          docker logs drivelog 2>&1 | grep -F "Lösenordet ändrades inte"
          test "$(logga_in "$CI_BYTT_PASSWORD")" = 200

      - name: Utan konto och utan uppgifter öppnas inte port 443
        run: |
          . "$RUNNER_TEMP/addon.sh"
          docker rm -f drivelog >/dev/null
          docker volume create drivelog-tom >/dev/null
          skriv_options drivelog-tom 0
          starta drivelog-tom drivelog-tom
          vanta_pa_logg drivelog-tom "Det finns inget konto"
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' drivelog-tom)" = true
          if curl -ksS --max-time 5 -o /dev/null https://localhost/ 2>/dev/null; then echo "Port 443 svarar utan konto" >&2; exit 1; fi
          if curl -sS --max-time 5 -o /dev/null http://localhost/ 2>/dev/null; then echo "Port 80 svarar utan konto" >&2; exit 1; fi
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' drivelog-tom)"
          curl -fsS --max-time 5 "http://$ip:8000/api/v1/auth/setup-status"; echo
          # Spärrläget: ingen annan container kan skapa första kontot via API:t.
          annan_container '
          import json, sys, urllib.error, urllib.request
          req = urllib.request.Request(f"http://{sys.argv[1]}:8000/api/v1/auth/setup", method="POST",
                                       data=json.dumps({"email": "inkraktare@example.com", "password": "x" * 20}).encode(),
                                       headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=15)
              raise SystemExit("setup godtogs i spärrläget")
          except urllib.error.HTTPError as fel:
              text = fel.read().decode()
              print(fel.code, text)
              assert fel.code == 403 and "setup_disabled" in text
          ' "$ip"
          test "$(curl -fsS --max-time 5 "http://$ip:8000/api/v1/auth/setup-status")" = '{"needs_setup":true}'
          # Layouten gäller också en helt ny /data.
          test "$(docker exec drivelog-tom stat -c '%a %U' /data)" = "711 root"
          test "$(docker exec drivelog-tom stat -c '%a %U' /data/app)" = "700 drivelog"
          docker stop -t 30 drivelog-tom >/dev/null
          test "$(docker inspect -f '{{.State.ExitCode}}' drivelog-tom)" = 0

      - name: Egen server – installationsraden (deploy/server.sh) installerar, uppdaterar och byter lösenord
        run: |
          . "$RUNNER_TEMP/addon.sh"
          docker rm -f drivelog-tom >/dev/null 2>&1 || true
          DATA="$RUNNER_TEMP/server-data"
          # Samma avbild som nyss byggdes (ingen hämtning) och egen datakatalog, som på en hyrd server.
          # Värdena ges uttryckligen till sudo (sudo -E är avstängt på byggmaskinen).
          server() { # [VARIABEL=värde …] -- argument till skriptet
            local miljo=()
            while [ "$1" != "--" ]; do miljo+=("$1"); shift; done
            shift
            sudo env DRIVELOG_IMAGE=drivelog-addon DRIVELOG_VERSION=test DRIVELOG_PULL=0 \
              DRIVELOG_DATA="$DATA" DRIVELOG_CONTAINER=drivelog-server "${miljo[@]}" deploy/server.sh "$@"
          }
          # 1) Ny installation utan frågor (uppgifterna i miljön).
          server DRIVELOG_ADMIN_EMAIL=ci@example.com DRIVELOG_ADMIN_PASSWORD="$CI_ADMIN_PASSWORD" -- localhost
          test "$(docker inspect -f '{{.Config.Image}}' drivelog-server)" = drivelog-addon:test
          SMOKE_EMAIL=ci@example.com SMOKE_PASSWORD="$CI_ADMIN_PASSWORD" deploy/smoke-test.sh https://localhost
          # Lösenordet ligger inte kvar i inställningsfilen eller någon annanstans i datakatalogen.
          sudo python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); assert d["admin_password"] == "" and d["admin_email"] == "ci@example.com" and d["domain"] == "localhost", d' "$DATA/options.json"
          test "$(sudo stat -c '%a %U' "$DATA/options.json")" = "600 root"
          if sudo grep -rF "$CI_ADMIN_PASSWORD" "$DATA" >/dev/null 2>&1; then
            echo "Lösenordet finns i klartext i datakatalogen" >&2; exit 1
          fi
          test "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' drivelog-server)" = unless-stopped
          # 2) Samma rad igen = uppdatering: inga frågor (här finns ingen terminal), kontot finns kvar.
          server -- localhost </dev/null
          test "$(logga_in "$CI_ADMIN_PASSWORD")" = 200
          # 3) Glömt lösenord: --nytt-losenord byter det, och det gamla slutar gälla.
          server DRIVELOG_ADMIN_EMAIL=ci@example.com DRIVELOG_ADMIN_PASSWORD="$CI_NYTT_PASSWORD" -- localhost --nytt-losenord
          test "$(logga_in "$CI_NYTT_PASSWORD")" = 200
          test "$(logga_in "$CI_ADMIN_PASSWORD")" = 401
          if sudo grep -rF "$CI_NYTT_PASSWORD" "$DATA" >/dev/null 2>&1; then
            echo "Det nya lösenordet finns i klartext i datakatalogen" >&2; exit 1
          fi
          # 3b) Extra domäner: sparas i inställningsfilen, Caddy får ett block för domänen och
          #     DriveLog ansluts till Docker-nätet smgd, där trafiken når en tjänst med namnet
          #     transcribe. Valet behålls när raden körs igen utan det och tas bort med
          #     --utan-extra-doman. DriveLog självt (127.0.0.1, localhost) avvisas som mål.
          extra() { sudo python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["extra_domains"])' "$DATA/options.json"; }
          natverk() { docker inspect -f '{{range $n, $_ := .NetworkSettings.Networks}}{{$n}} {{end}}' drivelog-server; }
          server -- localhost --extra-doman extra.localhost=transcribe:8080 </dev/null
          test "$(extra)" = "['extra.localhost=transcribe:8080']"
          natverk | grep -qw smgd
          docker exec drivelog-server cat /run/drivelog/Caddyfile | grep -F "reverse_proxy transcribe:8080 {"
          test "$(logga_in "$CI_NYTT_PASSWORD")" = 200
          docker run -d --name transcribe --network smgd --entrypoint python3 drivelog-addon:test -m http.server 8080 >/dev/null
          for _ in $(seq 1 30); do
            curl -ksSI --resolve extra.localhost:443:127.0.0.1 https://extra.localhost/ > "$RUNNER_TEMP/extra.txt" 2>/dev/null \
              && grep -q '^HTTP/[0-9.]* 200' "$RUNNER_TEMP/extra.txt" && break
            sleep 2
          done
          cat "$RUNNER_TEMP/extra.txt"
          grep -q '^HTTP/[0-9.]* 200' "$RUNNER_TEMP/extra.txt"
          if grep -qi '^x-frame-options' "$RUNNER_TEMP/extra.txt"; then echo "DriveLogs huvuden i den extra domänen" >&2; exit 1; fi
          for mal in 127.0.0.1:8000 localhost:3000 172.17.0.1:22 host.docker.internal:80 drivelog:8000; do
            if server -- localhost --extra-doman "extra.localhost=$mal" </dev/null; then
              echo "Målet $mal godtogs" >&2; exit 1
            fi
          done
          test "$(extra)" = "['extra.localhost=transcribe:8080']"
          # En rad mot 127.0.0.1 som redan står i inställningarna (1.4 föreslog det) hoppas över med
          # en varning – DriveLog startar ändå, med de andra raderna.
          sudo python3 -c 'import json, sys; p = sys.argv[1]; d = json.load(open(p)); d["extra_domains"].insert(0, "gammal.localhost=127.0.0.1:8000"); json.dump(d, open(p, "w"))' "$DATA/options.json"
          server -- localhost </dev/null
          test "$(logga_in "$CI_NYTT_PASSWORD")" = 200
          docker logs drivelog-server 2>&1 | grep -F "'gammal.localhost=127.0.0.1:8000' används inte"
          if docker exec drivelog-server cat /run/drivelog/Caddyfile | grep -F gammal.localhost; then exit 1; fi
          server -- localhost --extra-doman extra.localhost=transcribe:8080 </dev/null
          server -- localhost </dev/null
          test "$(extra)" = "['extra.localhost=transcribe:8080']"
          natverk | grep -qw smgd
          server -- localhost --utan-extra-doman </dev/null
          test "$(extra)" = "[]"
          if natverk | grep -qw smgd; then echo "DriveLog är kvar i nätet smgd" >&2; exit 1; fi
          if docker exec drivelog-server cat /run/drivelog/Caddyfile | grep -F transcribe; then exit 1; fi
          test "$(logga_in "$CI_NYTT_PASSWORD")" = 200
          docker rm -f transcribe >/dev/null
          # 4) Ny server utan uppgifter och utan terminal: tydligt fel i stället för en halv installation.
          docker rm -f drivelog-server >/dev/null
          if server DRIVELOG_DATA="$RUNNER_TEMP/server-tom" DRIVELOG_CONTAINER=drivelog-server-tom -- localhost \
               </dev/null 2> "$RUNNER_TEMP/server-fel.txt"; then
            echo "Skriptet gick igenom utan konto" >&2; exit 1
          fi
          grep -F "Ingen terminal att fråga i" "$RUNNER_TEMP/server-fel.txt"
          test -z "$(docker ps -aq --filter name=drivelog-server-tom)"

      - name: Egen server – automatisk uppdatering (timer, uppgradering, återgång, lås, avstängning)
        run: |
          . "$RUNNER_TEMP/addon.sh"
          # Fortsätter med datakatalogen från förra steget (kontot finns, lösenordet är CI_NYTT_PASSWORD).
          DATA="$RUNNER_TEMP/server-data"
          HEM="$RUNNER_TEMP/server-hem"
          KALLA="$RUNNER_TEMP/server-kalla"
          ENHET=drivelog-uppdatering
          # Versionskällan är en lokal fil (file://) i stället för config.yaml på GitHub, och
          # avbilderna är den nyss byggda med ny versionsetikett – inget hämtas eller publiceras.
          erbjud() { mkdir -p "$KALLA/drivelog"; printf 'name: "SMGD DriveLog"\nversion: "%s"\nslug: drivelog\n' "$1" > "$KALLA/drivelog/config.yaml"; }
          # Källan har också skriptet: kommer det genom ett rör (curl … | bash) hämtas kopian därifrån.
          mkdir -p "$KALLA/deploy"; cp deploy/server.sh "$KALLA/deploy/server.sh"
          ny_version() { # version [trasig|hanger]
            local cid andra=(--change "LABEL io.hass.version=$1" --change "ENV DRIVELOG_ADDON_VERSION=$1")
            # Den trasiga versionen "migrerar" datat (skriver en fil) och avslutar sedan med fel.
            [ "${2:-}" != trasig ] || andra+=(--change 'CMD ["/bin/sh", "-c", "echo Trasig testversion >&2; touch /data/app/trasig-migrering; exit 3"]')
            # Den som hänger "migrerar" också men svarar aldrig – provet hinner avbryta skriptet under väntan.
            [ "${2:-}" != hanger ] || andra+=(--change 'CMD ["/bin/sh", "-c", "touch /data/app/trasig-migrering; exec sleep 600"]')
            cid="$(docker create drivelog-addon:test)"
            docker commit "${andra[@]}" "$cid" "drivelog-addon:$1" >/dev/null
            docker rm "$cid" >/dev/null
          }
          auto_server() { # [VARIABEL=värde …] -- argument till skriptet
            local miljo=()
            while [ "$1" != "--" ]; do miljo+=("$1"); shift; done
            shift
            sudo env DRIVELOG_IMAGE=drivelog-addon DRIVELOG_PULL=0 DRIVELOG_DATA="$DATA" DRIVELOG_CONTAINER=drivelog-server \
              DRIVELOG_HEM="$HEM" DRIVELOG_REPO_RAW="file://$KALLA" DRIVELOG_WAIT=240 "${miljo[@]}" deploy/server.sh "$@"
          }
          # Som ägarens rad: skriptet kommer på standard in (curl … | sudo bash -s --), ingen fil att kopiera.
          auto_ror() {
            cat deploy/server.sh | sudo env DRIVELOG_IMAGE=drivelog-addon DRIVELOG_PULL=0 DRIVELOG_DATA="$DATA" \
              DRIVELOG_CONTAINER=drivelog-server DRIVELOG_HEM="$HEM" DRIVELOG_REPO_RAW="file://$KALLA" DRIVELOG_WAIT=240 \
              bash -s -- "$@"
          }
          kor_tjansten() { sudo systemctl start "$ENHET.service"; }
          tjanstens_lage() { systemctl show -p ActiveState --value "$ENHET.service"; }
          version() { docker inspect -f '{{ index .Config.Labels "io.hass.version" }}' drivelog-server; }
          startad() { docker inspect -f '{{.State.StartedAt}}' drivelog-server; }
          logg() { sudo cat "$HEM/uppdatering.log"; }
          for v in 900.0.0 900.1.0 900.3.0; do ny_version "$v"; done
          ny_version 900.2.0 trasig
          ny_version 900.1.5 hanger

          # 1) Slå på genom röret, som ägaren gör: installerar den erbjudna versionen och startar
          #    timern. Kopian som timern kör hämtas ur källan och är samma fil.
          erbjud 900.0.0
          auto_ror localhost --automatisk-uppdatering
          test "$(docker inspect -f '{{.Config.Image}}' drivelog-server)" = drivelog-addon:900.0.0
          test "$(systemctl is-enabled "$ENHET.timer")" = enabled
          test "$(systemctl is-active "$ENHET.timer")" = active
          sudo cmp deploy/server.sh "$HEM/server.sh"
          test "$(sudo stat -c '%a %U' "$HEM/server.sh")" = "700 root"
          grep -F "ExecStart=/bin/bash $HEM/server.sh --tidsstyrd" "/etc/systemd/system/$ENHET.service"
          test "$(logga_in "$CI_NYTT_PASSWORD")" = 200

          # 2) Ingen ny version: ingenting händer, ingen omstart.
          fore="$(startad)"
          kor_tjansten
          test "$(startad)" = "$fore"
          logg | grep -F "Ingen ny version (kör 900.0.0, erbjuds 900.0.0)."
          sudo journalctl -t "$ENHET" --no-pager | grep -F "Ingen ny version"

          # 3) Ny version erbjuds: säkerhetskopia, uppgradering, rätt version svarar, datat finns kvar.
          #    Tre äldre kopior har senare tidsstämplar i namnet (klockan gick fel en gång): städningen
          #    går på ändringstid och tar aldrig bort den nya kopian.
          for d in 1 2 3; do
            f="$HEM/kopior/drivelog-data-2999010${d}T000000-0.9.0.tar.gz"
            sudo sh -c ": | gzip > '$f'"; sudo touch -d "2020-01-0$d" "$f"
          done
          erbjud 900.1.0
          kor_tjansten
          test "$(version)" = 900.1.0
          test "$(docker inspect -f '{{.Config.Image}}' drivelog-server)" = drivelog-addon:900.1.0
          test "$(logga_in "$CI_NYTT_PASSWORD")" = 200
          SMOKE_EMAIL=ci@example.com SMOKE_PASSWORD="$CI_NYTT_PASSWORD" deploy/smoke-test.sh https://localhost
          sudo sh -c "ls $HEM/kopior/drivelog-data-*-900.0.0.tar.gz"
          sudo sh -c "tar -tzf $HEM/kopior/drivelog-data-*-900.0.0.tar.gz" | grep -F ./app/drivelog.sqlite3
          logg | grep -F "Klart: DriveLog 900.1.0 är igång och svarar."
          test "$(sudo sh -c "ls $HEM/kopior/drivelog-data-*.tar.gz" | wc -l)" = 3
          sudo test ! -e "$HEM/kopior/drivelog-data-29990101T000000-0.9.0.tar.gz"
          sudo test -e "$HEM/kopior/drivelog-data-29990103T000000-0.9.0.tar.gz"
          sudo test ! -e "$HEM/pagaende-uppgradering"

          # 3b) Avbrott efter docker stop, före säkerhetskopian (som när servern startas om): markeringen
          #     finns, DriveLog är stoppad och en halvfärdig kopia ligger kvar. Nästa körning startar
          #     den förra versionen igen och städar.
          gammal_id="$(docker inspect -f '{{.Image}}' drivelog-server)"
          docker stop -t 30 drivelog-server >/dev/null
          printf 'fas=stoppad\ngammal=900.1.0\ngammal_bild=%s\nny=900.1.5\nkopia=\ndata=%s\nnamn=drivelog-server\n' "$gammal_id" "$DATA" \
            | sudo tee "$HEM/pagaende-uppgradering" >/dev/null
          echo halv | sudo tee "$HEM/kopior/drivelog-data-20261116T000000-900.1.0.tar.gz.tmp" >/dev/null
          kor_tjansten
          test "$(docker inspect -f '{{.State.Running}}' drivelog-server)" = true
          test "$(version)" = 900.1.0
          sudo test ! -e "$HEM/pagaende-uppgradering"
          sudo test ! -e "$HEM/kopior/drivelog-data-20261116T000000-900.1.0.tar.gz.tmp"
          logg | grep -F "avbröts under säkerhetskopieringen; DriveLog 900.1.0 kör igen"
          test "$(logga_in "$CI_NYTT_PASSWORD")" = 200

          # 3c) Tjänsten dödas medan den nya versionen provas (som ett strömavbrott för skriptet):
          #     den nya containern lever kvar med migrerat data. Nästa körning litar inte på den utan
          #     går tillbaka till 900.1.0 med datat från före försöket, och tillåter ett nytt försök.
          erbjud 900.1.5
          sudo systemctl start --no-block "$ENHET.service"
          for _ in $(seq 1 120); do
            [ "$(version 2>/dev/null)" = 900.1.5 ] && sudo test -e "$DATA/app/trasig-migrering" && break
            sleep 1
          done
          test "$(version)" = 900.1.5
          test "$(tjanstens_lage)" = activating
          sudo systemctl kill --signal=KILL "$ENHET.service"
          for _ in $(seq 1 30); do [ "$(tjanstens_lage)" != activating ] && break; sleep 1; done
          test "$(tjanstens_lage)" != activating
          sudo grep -x "fas=provar" "$HEM/pagaende-uppgradering"
          test "$(version)" = 900.1.5
          kor_tjansten
          test "$(version)" = 900.1.0
          test "$(docker inspect -f '{{.State.Running}}' drivelog-server)" = true
          if sudo test -e "$DATA/app/trasig-migrering"; then echo "Datat återställdes inte efter avbrottet" >&2; exit 1; fi
          sudo test ! -e "$HEM/pagaende-uppgradering"
          sudo grep -x "avbruten_version=900.1.5" "$HEM/lage.txt"
          logg | grep -F "Uppgraderingen till 900.1.5 avbröts innan den var kontrollerad"
          test "$(logga_in "$CI_NYTT_PASSWORD")" = 200

          # 4) Trasig ny version: återgång till 900.1.0 med datat från före försöket.
          erbjud 900.2.0
          if kor_tjansten; then echo "Tjänsten lyckades trots trasig version" >&2; exit 1; fi
          test "$(version)" = 900.1.0
          test "$(docker inspect -f '{{.State.Running}}' drivelog-server)" = true
          if sudo test -e "$DATA/app/trasig-migrering"; then echo "Datat återställdes inte" >&2; exit 1; fi
          test "$(logga_in "$CI_NYTT_PASSWORD")" = 200
          logg | grep -F "Återgick till DriveLog 900.1.0"
          sudo grep -x "misslyckad_version=900.2.0" "$HEM/lage.txt"
          # … och samma version prövas inte igen.
          fore="$(startad)"
          kor_tjansten
          test "$(startad)" = "$fore"
          test "$(version)" = 900.1.0
          logg | grep -F "Version 900.2.0 startade inte förra gången – försöker inte igen"

          # 5) Läget i klartext.
          auto_server -- --lage | tee "$RUNNER_TEMP/lage.txt"
          grep -F "Automatisk uppdatering:  på" "$RUNNER_TEMP/lage.txt"
          grep -F "Kör version:             900.1.0 (igång)" "$RUNNER_TEMP/lage.txt"
          grep -F "Senaste uppgradering:" "$RUNNER_TEMP/lage.txt" | grep -F "900.0.0 → 900.1.0"
          grep -F "Hoppar över version:     900.2.0" "$RUNNER_TEMP/lage.txt"

          # 6) Lås: medan en annan körning håller låset gör tjänsten ingenting.
          erbjud 900.3.0
          fore="$(startad)"
          sudo flock /run/lock/drivelog-server.lock systemctl start "$ENHET.service"
          test "$(startad)" = "$fore"
          logg | grep -F "En annan körning pågår redan"
          # Raden för hand fungerar som förut med automatiken på – och förnyar kopian.
          echo "# gammal kopia" | sudo tee -a "$HEM/server.sh" >/dev/null
          auto_server -- localhost </dev/null
          test "$(version)" = 900.3.0
          sudo cmp deploy/server.sh "$HEM/server.sh"
          if sudo grep -q misslyckad_version "$HEM/lage.txt"; then echo "Minnet av den misslyckade versionen finns kvar" >&2; exit 1; fi
          test "$(systemctl is-active "$ENHET.timer")" = active

          # Raden för hand med en tom datakatalog men säkerhetskopior: inget nytt, tomt konto skapas.
          if auto_server DRIVELOG_DATA="$RUNNER_TEMP/server-forsvunnen" DRIVELOG_CONTAINER=drivelog-server-tom -- localhost \
               </dev/null 2> "$RUNNER_TEMP/server-fel.txt"; then
            echo "Skriptet skapade ett nytt konto trots säkerhetskopior" >&2; exit 1
          fi
          grep -F "Inget nytt konto skapas" "$RUNNER_TEMP/server-fel.txt"
          test -z "$(docker ps -aq --filter name=drivelog-server-tom)"
          test "$(version)" = 900.3.0

          # Inga hemligheter i automatikens filer eller i journalen.
          for pw in "$CI_ADMIN_PASSWORD" "$CI_NYTT_PASSWORD"; do
            if sudo grep -rF "$pw" "$HEM/automatik.conf" "$HEM/lage.txt" "$HEM/uppdatering.log" >/dev/null 2>&1 \
              || sudo journalctl -t "$ENHET" --no-pager | grep -F "$pw" >/dev/null; then
              echo "Ett lösenord finns i automatikens filer eller i journalen" >&2; exit 1
            fi
          done

          # 7) Slå av: timern och tjänsten är borta, DriveLog kör vidare.
          auto_server -- --utan-automatisk-uppdatering
          test ! -e "/etc/systemd/system/$ENHET.timer"
          test ! -e "/etc/systemd/system/$ENHET.service"
          if systemctl is-active --quiet "$ENHET.timer"; then echo "Timern är fortfarande aktiv" >&2; exit 1; fi
          if systemctl list-timers --all --no-legend | grep -F "$ENHET" >/dev/null; then echo "Timern finns kvar" >&2; exit 1; fi
          test "$(docker inspect -f '{{.State.Running}}' drivelog-server)" = true
          auto_server -- --lage | grep -F "Automatisk uppdatering:  av"

      - name: Egen server – automatikens logg vid fel
        if: failure()
        run: |
          sudo cat "$RUNNER_TEMP/server-hem/uppdatering.log" 2>/dev/null || true
          sudo journalctl -t drivelog-uppdatering --no-pager -n 200 2>/dev/null || true
          systemctl status drivelog-uppdatering.timer drivelog-uppdatering.service --no-pager 2>/dev/null || true

      - name: Egen server – städa automatiken
        if: always()
        run: |
          sudo systemctl disable --now drivelog-uppdatering.timer >/dev/null 2>&1 || true
          sudo rm -f /etc/systemd/system/drivelog-uppdatering.timer /etc/systemd/system/drivelog-uppdatering.service
          sudo systemctl daemon-reload || true
          sudo rm -rf "$RUNNER_TEMP/server-hem" "$RUNNER_TEMP/server-kalla" "$RUNNER_TEMP/lage.txt" "$RUNNER_TEMP/server-forsvunnen"
          docker rmi drivelog-addon:900.0.0 drivelog-addon:900.1.0 drivelog-addon:900.1.5 drivelog-addon:900.2.0 \
            drivelog-addon:900.3.0 >/dev/null 2>&1 || true

      - name: Loggar vid fel
        if: failure()
        run: |
          for c in drivelog drivelog-tom drivelog-server; do
            docker inspect -f '{{.Name}} {{.State.Status}} kod={{.State.ExitCode}}' "$c" 2>/dev/null || continue
            docker logs --tail 300 "$c" 2>&1
          done

      - name: Städa
        if: always()
        run: |
          docker rm -f drivelog drivelog-tom drivelog-server drivelog-server-tom transcribe >/dev/null 2>&1 || true
          docker network rm smgd >/dev/null 2>&1 || true
          docker volume rm drivelog-data drivelog-tom >/dev/null 2>&1 || true
          sudo rm -rf "$RUNNER_TEMP/server-data" "$RUNNER_TEMP/server-tom" "$RUNNER_TEMP/server-fel.txt" "$RUNNER_TEMP/extra.txt"
          rm -f "$RUNNER_TEMP/options.json" "$RUNNER_TEMP"/nycklar-* "$RUNNER_TEMP"/kaka* "$RUNNER_TEMP/inloggning.json"

  aarch64:
    name: aarch64 – bygg under emulering och provstarta
    needs: tester
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Läs versionen som byggs ur drivelog/VERSION
        id: meta
        run: echo "version=$(python3 .github/scripts/erbjud_version.py --visa)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Bygg avbilden (linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: drivelog/Dockerfile
          platforms: linux/arm64
          load: true
          provenance: false
          tags: drivelog-addon:arm64
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=addon-arm64
          cache-to: type=gha,mode=max,scope=addon-arm64

      - name: Etiketter och körtidsmiljöer under emulering
        run: |
          test "$(docker inspect -f '{{ index .Config.Labels "io.hass.arch" }}' drivelog-addon:arm64)" = aarch64
          test "$(docker inspect -f '{{.Architecture}}' drivelog-addon:arm64)" = arm64
          docker run --rm --platform linux/arm64 --entrypoint sh drivelog-addon:arm64 -c \
            'set -e; test "$(uname -m)" = aarch64; uname -m; python --version; node --version; caddy version; setpriv --version'

      - name: Tillägget startar (API:t blir redo, spärren håller utan konto)
        run: |
          docker volume create drivelog-arm >/dev/null
          echo '{"domain":"localhost","admin_email":"","admin_password":"","strato_dyndns":false,"strato_dyndns_user":"","strato_dyndns_password":"","log_level":"info"}' > "$RUNNER_TEMP/options.json"
          docker run --rm --platform linux/arm64 -v drivelog-arm:/data -v "$RUNNER_TEMP/options.json:/in.json:ro" \
            --entrypoint cp drivelog-addon:arm64 /in.json /data/options.json
          docker run -d --name drivelog-arm --platform linux/arm64 --init -v drivelog-arm:/data drivelog-addon:arm64 >/dev/null
          for _ in $(seq 1 300); do
            docker logs drivelog-arm 2>&1 | grep -F "Det finns inget konto" >/dev/null && break
            [ "$(docker inspect -f '{{.State.Running}}' drivelog-arm)" = true ] || { echo "Containern stannade" >&2; exit 1; }
            sleep 2
          done
          docker logs drivelog-arm 2>&1 | grep -F "Det finns inget konto" >/dev/null
          docker exec drivelog-arm python3 -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=10).read().decode())"
          test "$(docker exec drivelog-arm stat -c '%a %U' /data)" = "711 root"
          test "$(docker exec drivelog-arm stat -c '%a %U' /data/app)" = "700 drivelog"
          test "$(docker exec drivelog-arm stat -c '%a %U' /data/hemligheter)" = "700 root"
          docker stop -t 30 drivelog-arm >/dev/null
          test "$(docker inspect -f '{{.State.ExitCode}}' drivelog-arm)" = 0

      - name: Loggar vid fel
        if: failure()
        run: docker logs --tail 300 drivelog-arm 2>&1 || true

      - name: Städa
        if: always()
        run: |
          docker rm -f drivelog-arm >/dev/null 2>&1 || true
          docker volume rm drivelog-arm >/dev/null 2>&1 || true

  publicera:
    name: Publicera avbilden till GHCR
    needs: [tester, amd64, aarch64]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      # "true" bara när den här körningen faktiskt publicerade en ny avbild (VERSION höjd).
      publicerad: ${{ steps.finns.outputs.finns == 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Jobbet gör inga git-operationer: dess token (packages: write) ska inte ligga i .git/config.
          persist-credentials: false

      - name: Läs versionen ur drivelog/VERSION och avbildens namn ur drivelog/config.yaml
        id: meta
        # Inga paket från PyPI i det här jobbet: skriptet läser och kontrollerar avbildens namn
        # (under ghcr.io/<ägaren>/, gemener, ett namn för alla arkitekturer).
        run: |
          echo "version=$(python3 .github/scripts/erbjud_version.py --visa)" >> "$GITHUB_OUTPUT"
          namn="$(python3 .github/scripts/erbjud_version.py --namn)"
          echo "$namn" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Finns versionen redan?
        id: finns
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # En publicerad tagg skrivs aldrig över (Home Assistant-installationer hämtar den).
          # Bara ett uttryckligt "taggen finns inte" ger publicering; varje annat fel (nätverk,
          # behörighet, GHCR nere) avbryter jobbet i stället för att riskera att skriva över.
          if utskrift="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)"; then
            echo "::notice::$IMAGE:$VERSION finns redan – höj drivelog/VERSION (och CHANGELOG.md) för att publicera en ny."
            echo "finns=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$utskrift" | grep -qiE 'manifest unknown|: not found'; then
            echo "$IMAGE:$VERSION finns inte än – publiceras."
            echo "finns=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$utskrift" >&2
            echo "::error::Kunde inte avgöra om $IMAGE:$VERSION redan finns. Inget publiceras."
            exit 1
          fi

      - name: Bygg och publicera (amd64 + arm64)
        if: steps.finns.outputs.finns == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: drivelog/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: BUILD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: |
            type=gha,scope=addon-amd64
            type=gha,scope=addon-arm64

      - name: Kontrollera den publicerade avbilden
        if: steps.finns.outputs.finns == 'false'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  erbjud:
    name: Erbjud versionen i Home Assistant
    # Höjer `version` i drivelog/config.yaml till drivelog/VERSION – först när avbilden finns på
    # GHCR för båda arkitekturerna. Det är den raden Home Assistant läser för att visa "Uppdatera".
    needs: publicera
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      publicerad: ${{ needs.publicera.outputs.publicerad }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Läs versionen som erbjuds ur drivelog/VERSION
        id: meta
        run: echo "version=$(python3 .github/scripts/erbjud_version.py --visa)" >> "$GITHUB_OUTPUT"

      - name: Avbilden går att hämta utan inloggning, för amd64 och arm64
        # Samma fråga som Home Assistant ställer: anonymt, utan GitHub-inloggning. Är paketet
        # privat eller saknas en arkitektur misslyckas steget – och då erbjuds versionen inte.
        run: python3 .github/scripts/erbjud_version.py --avbild

      - name: Höj version i drivelog/config.yaml på standardgrenen
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GREN: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for forsok in 1 2 3 4 5; do
            # Utgå alltid från grenens senaste läge: någon kan ha checkat in under bygget.
            git fetch --quiet origin "+refs/heads/$GREN:refs/remotes/origin/$GREN"
            git checkout --quiet --detach "origin/$GREN"
            if [ "$(python3 .github/scripts/erbjud_version.py --visa)" != "$VERSION" ]; then
              echo "::notice::drivelog/VERSION har ändrats sedan den här körningen startade – den nyare körningen erbjuder sin version när dess avbild är publicerad."
              exit 0
            fi
            resultat="$(python3 .github/scripts/erbjud_version.py)"
            if [ "$resultat" = oforandrad ]; then
              echo "drivelog/config.yaml visar redan $VERSION."
              exit 0
            fi
            git commit --quiet -m "Tillägget $VERSION erbjuds i Home Assistant (avbilden är publicerad)" drivelog/config.yaml
            if git push --quiet origin "HEAD:refs/heads/$GREN"; then
              echo "::notice::drivelog/config.yaml visar nu $VERSION – Home Assistant erbjuder uppdateringen."
              exit 0
            fi
            echo "Grenen ändrades under tiden – försöker igen ($forsok)."
            sleep $((forsok * 3))
          done
          echo "::error::Kunde inte checka in den höjda versionen. Avbilden $VERSION är publicerad; kör arbetsflödet igen eller höj version i drivelog/config.yaml för hand."
          exit 1

  utgava:
    name: GitHub-utgåva för HACS
    # HACS visar senaste utgåvans tagg som integrationens version ("1.2.3 → 1.3.0") och erbjuder
    # en uppdatering bara när en ny utgåva finns. Körs först när versionen erbjuds i Home
    # Assistant. En misslyckad utgåva stoppar aldrig avbilden, erbjudandet eller uppdateringen
    # på servern, och en befintlig tagg eller utgåva skrivs aldrig över (.github/scripts/utgava.py).
    # Bara när körningen publicerade en ny avbild: en incheckning utan höjd VERSION får aldrig
    # skapa en utgåva för den gällande versionen på en commit som inte var dess utgivning.
    needs: erbjud
    if: >-
      github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && needs.erbjud.outputs.publicerad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Utgåvans text ur CHANGELOG.md
        run: python3 .github/scripts/utgava.py --anteckningar > "$RUNNER_TEMP/notes.md"

      - name: Skapa utgåvan om den inte redan finns
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/utgava.py --skapa "$RUNNER_TEMP/notes.md"

      - name: Säg till när utgåvan inte kunde skapas
        # Jobbet får misslyckas utan att körningen blir röd; varningen syns i körningens sammanfattning.
        if: failure()
        run: echo "::warning::GitHub-utgåvan kunde inte skapas – HACS erbjuder inte den nya versionen förrän den finns. Kör jobbet utgava igen."
