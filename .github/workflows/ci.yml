# Kontrollerar varje ändring: backend-tester (SQLite och PostgreSQL), webbappens bygge,
# och – viktigast – att Docker-avbilderna går att bygga och att hela systemet startar
# med Docker Compose precis som på en riktig server.
name: CI

on:
  push:
    # Bara repots egna grenar – inte tillfälliga grenar från andra verktyg.
    branches:
      - main
      - "claude/relaxed-galileo-k3i0cz"
  workflow_dispatch:

# En körning i taget per gren. En pågående körning får gå klart (den provstartar hela
# systemet); nyare ändringar väntar på sin tur.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend – lint och tester
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Installera
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check app tests
      - name: Tester (SQLite)
        run: .venv/bin/python -m pytest tests -q -p no:cacheprovider
      - name: Tester (PostgreSQL)
        env:
          DRIVELOG_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: .venv/bin/python -m pytest tests -q -p no:cacheprovider

  frontend:
    name: Webbapp – typkontroll, lint och bygge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installera
        run: npm ci --no-audit --no-fund
      - name: Typkontroll
        # Next skapar typerna för sidor och layouter (PageProps, LayoutProps) först.
        run: npm run typecheck
      - name: Lint
        run: npx eslint . --max-warnings=0
      - name: Bygg
        run: npm run build

  stack:
    name: Docker – bygg avbilderna och provstarta hela systemet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Slumpa ett lösenord för testkontot
        run: |
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "CI_ADMIN_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Installera med skriptet, precis som på en server
        env:
          DRIVELOG_ADMIN_EMAIL: ci@example.com
          DRIVELOG_ADMIN_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
        run: deploy/install.sh localhost

      - name: Att köra skriptet igen ändrar ingenting (uppgradering)
        run: |
          cp .env .env.before
          deploy/install.sh --no-build localhost
          diff .env .env.before

      - name: Röktest genom proxyn (HTTPS)
        env:
          SMOKE_EMAIL: ci@example.com
          SMOKE_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
        run: deploy/smoke-test.sh https://localhost

      - name: Säkerhetskopiering fungerar mot den körande stacken
        run: |
          sh deploy/backup.sh
          ls -la backups/

      - name: Loggar vid fel
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 150

      - name: Stäng ned
        if: always()
        run: docker compose down -v
