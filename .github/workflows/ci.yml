# Kontrollerar varje ändring: backend-tester (SQLite och PostgreSQL), webbappens bygge,
# och – viktigast – att Docker-avbilderna går att bygga och att hela systemet startar
# med Docker Compose precis som på en riktig server.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend – lint och tester
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Installera
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check app tests
      - name: Tester (SQLite)
        run: .venv/bin/python -m pytest tests -q -p no:cacheprovider
      - name: Tester (PostgreSQL)
        env:
          DRIVELOG_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: .venv/bin/python -m pytest tests -q -p no:cacheprovider

  frontend:
    name: Webbapp – typkontroll, lint och bygge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installera
        run: npm ci --no-audit --no-fund
      - name: Typkontroll
        # Next skapar typerna för sidor och layouter (PageProps, LayoutProps) först.
        run: npm run typecheck
      - name: Lint
        run: npx eslint . --max-warnings=0
      - name: Bygg
        run: npm run build

  stack:
    name: Docker – bygg avbilderna och provstarta hela systemet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Skapa .env med installationsskriptet (slumpade hemligheter)
        run: deploy/install.sh --env-only localhost

      - name: Bygg avbilderna
        run: docker compose build

      - name: Starta och vänta tills alla tjänster är friska
        run: docker compose up -d --wait --wait-timeout 300

      - name: Röktest genom proxyn (HTTPS)
        run: deploy/smoke-test.sh https://localhost

      - name: Säkerhetskopiering fungerar mot den körande stacken
        run: |
          sh deploy/backup.sh
          ls -la backups/

      - name: Loggar vid fel
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 150

      - name: Stäng ned
        if: always()
        run: docker compose down -v
