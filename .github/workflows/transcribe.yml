# SMGD Transkribering (transcribe/): tester, bygge av Docker-avbilden, provstart, prov av den
# automatiska uppdateringen mot riktig Docker och systemd – och på standardgrenen publicering till
# ghcr.io/<ägare>/transcribe.
#
# Publicering: en version (ur transcribe/package.json) publiceras EN gång under sitt versionsnummer.
# Finns <version> redan byggs och skickas inget – höj versionen för att ge ut en ny. latest flyttas
# sedan (utan att något byggs om) till den utgivna versionen, men bara om den är högre än den latest
# redan pekar på. Servrarna installerar det som ligger som latest, så det är alltid en avbild som har
# provstartats här och som också finns under sitt versionsnummer.
#
# Actions är fästa vid commit-SHA (versionen står som kommentar), samma som övriga arbetsflöden.
name: Transkribering

on:
  push:
    branches:
      - main
      - "claude/relaxed-galileo-k3i0cz"
      - "claude/friendly-cray-irdv3u"
    paths:
      - "transcribe/**"
      - ".github/workflows/transcribe.yml"
  workflow_dispatch:

concurrency:
  group: transcribe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Typkontroll och tester
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: transcribe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: transcribe/package-lock.json
      - name: Installera
        run: npm ci --no-audit --no-fund
      - name: Typkontroll
        run: npm run typecheck
      - name: Tester
        run: npm test
      - name: Webbappens skript är giltig JavaScript
        run: node --check web/app.js && node --check web/pcm-worklet.js
      - name: Serverns skript (shellcheck och bash -n)
        run: |
          shellcheck --version | head -n 2
          shellcheck installera.sh uppdatera.sh
          shellcheck -x prov/kor.sh prov/lib.sh prov/prov_*.sh prov/latsas/*
          bash -n installera.sh && bash -n uppdatera.sh
      - name: Prov av installationsraden och den automatiska uppdateringen (låtsaskommandon)
        # Skripten kör som root på servern, så proven gör det också.
        run: sudo bash prov/kor.sh

  image:
    name: Bygg, provstarta och prova uppdateringen
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Läs versionen ur transcribe/package.json
        id: meta
        run: |
          version="$(node -p "require('./transcribe/package.json').version")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versionen i transcribe/package.json ska vara X.Y.Z (är: $version)."
            exit 1
          fi
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/transcribe" >> "$GITHUB_OUTPUT"
          echo "Version $version"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Bygg
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: transcribe
          load: true
          tags: transcribe:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
      - name: Provstart (ingen nyckel – tjänsten ska ändå starta och svara)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Avbilden bär sin version.
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' transcribe:ci)" = "$VERSION"
          docker network create smgd
          docker run -d --name transcribe --network smgd -p 127.0.0.1:8080:8080 \
            -e TRANSCRIBE_PUBLIC_URL=http://localhost:8080 transcribe:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health
          # /api/health svarar med samma version som etiketten.
          test "$(curl -fsS http://127.0.0.1:8080/api/health | node -p 'const h = JSON.parse(require("fs").readFileSync(0, "utf8")); h.ok === true ? h.version : "inte ok"')" = "$VERSION"
          curl -fsS http://127.0.0.1:8080/ | grep -q "<title>Transkribering</title>"
          docker logs transcribe 2>&1 | grep -q "Skapa administratörskontot här"
          # ffmpeg med AAC-kodare och SQLite med FTS5 finns i avbilden.
          docker exec transcribe ffmpeg -hide_banner -f lavfi -i "sine=frequency=440:duration=1" -c:a aac -f mp4 /tmp/t.m4a
          docker exec transcribe node -e "const D=require('better-sqlite3');new D(':memory:').exec('create virtual table f using fts5(a)')"
          docker exec transcribe node dist/cli.js inbjudan user | grep -q "/#/inbjudan/"
          # Kommandot som den automatiska uppdateringen frågar: ledig, kod 0.
          test "$(docker exec transcribe node dist/cli.js upptagen)" = ledig
          # Hälsokontrollen i avbilden blir "healthy".
          for _ in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' transcribe)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' transcribe | grep -q healthy
      - name: Logg vid fel
        if: failure()
        run: docker logs transcribe || true

      - name: Egen server – dagens server (1.0.0 utan etikett, gammal compose-fil) uppgraderas av raden
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Som ägarens server ser ut idag: 1.0.0 byggd ur incheckningen den gavs ut i (avbilden har
          # ingen versionsetikett och saknar kommandot "upptagen"), startad med den gamla
          # docker-compose.yml och en .env utan TRANSCRIBE_VERSION. Avbilderna heter transcribe-idag
          # lokalt (bara namnet i compose-filen är utbytt), och inget hämtas eller publiceras.
          docker rm -f -v transcribe >/dev/null 2>&1 || true # provstarten ovan
          V100=f4e854efa05cb0a5241c9e361a4ce1f67ce03423
          KAT="$RUNNER_TEMP/transcribe-idag"
          KALLA="$RUNNER_TEMP/transcribe-idag-kalla"
          GAMMAL="$RUNNER_TEMP/transcribe-1.0.0"
          B=transcribe-idag
          PW="$(openssl rand -base64 18)"
          echo "::add-mask::$PW"
          ETIKETT='{{with .Config.Labels}}{{index . "org.opencontainers.image.version"}}{{end}}'
          installera() {
            cat transcribe/installera.sh | sudo env TRANSCRIBE_KATALOG="$KAT" TRANSCRIBE_REPO_RAW="file://$KALLA" \
              TRANSCRIBE_PULL=0 TRANSCRIBE_VANTA=120 bash -s -- drivelog.example.com transcribe.example.com --utan-automatisk-uppdatering
          }
          halsa() { docker inspect -f '{{.State.Health.Status}}' transcribe; }
          logga_in() {
            docker exec -e PW="$PW" transcribe node -e 'fetch("http://127.0.0.1:8080/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: "idag@example.com", password: process.env.PW }) }).then((r) => console.log(r.status), () => console.log(0))'
          }

          # 1.0.0 byggs ur sin incheckning. Etiketten saknas (inte ens basavbilden har en).
          git fetch --no-tags --depth=1 origin "$V100"
          mkdir -p "$GAMMAL"
          git archive "$V100" transcribe | tar -x -C "$GAMMAL"
          docker build -q -t "$B:1.0.0" "$GAMMAL/transcribe" >/dev/null
          test -z "$(docker image inspect -f "$ETIKETT" "$B:1.0.0" | sed 's/<no value>//')"
          docker tag "$B:1.0.0" "$B:latest"

          mkdir -p "$KALLA/deploy" "$KALLA/transcribe"
          printf '#!/usr/bin/env bash\necho "   (DriveLogs skript i provet: $*)"\n' > "$KALLA/deploy/server.sh"
          cp transcribe/docker-compose.yml transcribe/uppdatera.sh transcribe/.env.example "$KALLA/transcribe/"
          sudo mkdir -p "$KAT"
          git show "$V100:transcribe/docker-compose.yml" | sed "s|image: ghcr.io/smgd-mp/transcribe:latest|image: $B:latest|" \
            | sudo tee "$KAT/docker-compose.yml" >/dev/null
          sudo grep -qx "    image: $B:latest" "$KAT/docker-compose.yml"
          printf 'TRANSCRIBE_PUBLIC_URL=https://transcribe.example.com\nTRANSCRIBE_DOMAIN=transcribe.example.com\nTRANSCRIBE_IMAGE=%s\n' "$B" \
            | sudo tee "$KAT/.env" >/dev/null
          sudo chmod 600 "$KAT/.env"
          (cd "$KAT" && sudo docker compose up -d)
          for _ in $(seq 1 60); do [ "$(halsa)" = healthy ] && break; sleep 2; done
          test "$(halsa)" = healthy
          test "$(docker exec transcribe node -p "require('/app/package.json').version")" = 1.0.0
          # 1.0.0 saknar "upptagen" (hjälptext, kod 1) …
          if docker exec transcribe node dist/cli.js upptagen; then echo "1.0.0 borde sakna kommandot upptagen" >&2; exit 1; fi
          # … så uppdatera.sh frågar databasen direkt. Frågan fungerar mot 1.0.0:s riktiga databas.
          fraga="$(sed -n "s/^FRAGA_100='\(.*\)'$/\1/p" transcribe/uppdatera.sh)"
          test -n "$fraga"
          test "$(docker exec transcribe node -e "$fraga")" = 0
          token="$(docker exec transcribe node dist/cli.js inbjudan admin | grep -oE '/#/inbjudan/[A-Za-z0-9_-]+' | sed 's|.*/||')"
          docker exec -e PW="$PW" -e TOKEN="$token" transcribe node -e 'fetch("http://127.0.0.1:8080/api/invites/" + process.env.TOKEN, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: "idag@example.com", password: process.env.PW }) }).then(async (r) => { if (!r.ok) { console.error(r.status, await r.text()); process.exit(1); } })'
          test "$(logga_in)" = 200

          # Första körningen av raden, innan något nyare finns: ingen omstart, versionen låses i .env
          # (lästes ur package.json) och den nya compose-filen läggs på plats.
          fore="$(docker inspect -f '{{.State.StartedAt}}' transcribe)"
          installera
          test "$(docker inspect -f '{{.State.StartedAt}}' transcribe)" = "$fore"
          sudo grep -qx "TRANSCRIBE_VERSION=1.0.0" "$KAT/.env"
          sudo cmp transcribe/docker-compose.yml "$KAT/docker-compose.yml"
          sudo grep -F "TRANSCRIBE_VERSION i .env är nu 1.0.0 (versionen som kör)." "$KAT/uppdatering.log"
          (cd "$KAT" && sudo docker compose config --images) | grep -qx "$B:1.0.0"

          # Den nya versionen erbjuds: raden uppgraderar med säkerhetskopia, och kontot finns kvar.
          docker tag transcribe:ci "$B:latest"
          installera
          test "$(docker inspect -f "$ETIKETT" transcribe)" = "$VERSION"
          test "$(halsa)" = healthy
          test "$(logga_in)" = 200
          sudo sh -c "test -f $KAT/kopior/*-1.0.0/transcribe.db"
          sudo grep -qx "TRANSCRIBE_VERSION=$VERSION" "$KAT/.env"
          sudo grep -F "Klart: SMGD Transkribering $VERSION är igång och frisk." "$KAT/uppdatering.log"
          sudo test ! -e "$KAT/pagaende-uppgradering"
          # Båda versionerna finns lokalt (återgången skulle inte behöva nätet).
          docker image inspect "$B:1.0.0" "$B:$VERSION" >/dev/null

          # Städa (nästa steg installerar på nytt i en egen katalog).
          (cd "$KAT" && sudo docker compose down -v)
          sudo rm -rf "$KAT" "$KALLA" "$GAMMAL"

      - name: Egen server – installationsraden och den automatiska uppdateringen (riktig Docker och systemd)
        run: |
          set -euo pipefail
          # Tjänsten installeras i en tillfällig katalog med installationsraden, som ägaren gör det,
          # men med lokala avbilder: TRANSCRIBE_IMAGE i .env pekar på versioner som skapas här ur den
          # nyss byggda avbilden, och TRANSCRIBE_PULL=0 – inget hämtas eller publiceras.
          docker rm -f -v transcribe >/dev/null 2>&1 || true # provstarten ovan
          KAT="$RUNNER_TEMP/transcribe-server"
          KALLA="$RUNNER_TEMP/transcribe-kalla"
          ENHET=transcribe-uppdatering
          B=transcribe-prov
          PW="$(openssl rand -base64 18)"
          echo "::add-mask::$PW"
          ny_version() { # version [trasig|hanger|langsam]
            local cid andra=(--change "LABEL org.opencontainers.image.version=$1")
            case "${2:-}" in
              # Den trasiga "migrerar" databasen (tar bort alla konton) och avslutar med fel.
              trasig) andra+=(--change 'CMD ["node", "-e", "const D = require(\"better-sqlite3\"); new D(\"/data/transcribe.db\").exec(\"PRAGMA foreign_keys = OFF; DELETE FROM sessions; DELETE FROM users\"); process.exit(3)"]') ;;
              # Den som hänger tar också bort kontona, men svarar aldrig.
              hanger) andra+=(--change 'CMD ["node", "-e", "const D = require(\"better-sqlite3\"); new D(\"/data/transcribe.db\").exec(\"PRAGMA foreign_keys = OFF; DELETE FROM sessions; DELETE FROM users\"); setInterval(() => {}, 1e9)"]') ;;
              # Den långsamma fungerar, men först efter 25 sekunder (provet hinner avbryta väntan).
              langsam) andra+=(--change 'CMD ["/bin/sh", "-c", "sleep 25; exec node --max-old-space-size=256 dist/server.js"]') ;;
            esac
            cid="$(docker create transcribe:ci)"
            docker commit "${andra[@]}" "$cid" "$B:$1" >/dev/null
            docker rm "$cid" >/dev/null
          }
          erbjud() { docker tag "$B:$1" "$B:latest"; }
          installera() { # [val]
            cat transcribe/installera.sh | sudo env TRANSCRIBE_KATALOG="$KAT" TRANSCRIBE_REPO_RAW="file://$KALLA" \
              TRANSCRIBE_PULL=0 TRANSCRIBE_VANTA=120 bash -s -- drivelog.example.com transcribe.example.com "$@"
          }
          uppdatera() { sudo env TRANSCRIBE_KATALOG="$KAT" TRANSCRIBE_PULL=0 bash "$KAT/uppdatera.sh" "$@"; }
          kor_tjansten() { sudo systemctl start "$ENHET.service"; }
          tjanstens_lage() { systemctl show -p ActiveState --value "$ENHET.service"; }
          version() { docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' transcribe; }
          halsa() { docker inspect -f '{{.State.Health.Status}}' transcribe; }
          kor() { docker inspect -f '{{.State.Running}}' transcribe; }
          startad() { docker inspect -f '{{.State.StartedAt}}' transcribe; }
          logg() { sudo cat "$KAT/uppdatering.log"; }
          frisk_pa() { # version
            test "$(version)" = "$1"
            test "$(docker inspect -f '{{.State.Running}}' transcribe)" = true
            test "$(halsa)" = healthy
          }
          logga_in() { # → HTTP-koden (inloggningen görs inne i containern; ingen port publiceras)
            docker exec -e PW="$PW" transcribe node -e 'fetch("http://127.0.0.1:8080/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: "ci@example.com", password: process.env.PW }) }).then((r) => console.log(r.status), () => console.log(0))'
          }
          for v in 900.0.0 900.1.0; do ny_version "$v"; done
          ny_version 900.2.0 langsam
          ny_version 900.3.0 trasig
          ny_version 900.4.0 hanger

          # Källan som installationsraden hämtar från (file://): filerna ur den här incheckningen
          # och en låtsad version av DriveLogs skript.
          mkdir -p "$KALLA/deploy" "$KALLA/transcribe"
          printf '#!/usr/bin/env bash\necho "   (DriveLogs skript i provet: $*)"\n' > "$KALLA/deploy/server.sh"
          cp transcribe/docker-compose.yml transcribe/uppdatera.sh transcribe/.env.example "$KALLA/transcribe/"
          sudo mkdir -p "$KAT"
          printf 'TRANSCRIBE_IMAGE=%s\n' "$B" | sudo tee "$KAT/.env" >/dev/null
          sudo chmod 600 "$KAT/.env"

          # 1) Installationsraden på en ny server: senaste versionen startas, låst i .env, och timern slås på.
          erbjud 900.0.0
          installera
          frisk_pa 900.0.0
          sudo grep -qx "TRANSCRIBE_VERSION=900.0.0" "$KAT/.env"
          sudo grep -qx "TRANSCRIBE_IMAGE=$B" "$KAT/.env"
          test "$(sudo stat -c '%a %U' "$KAT/.env")" = "600 root"
          sudo cmp transcribe/uppdatera.sh "$KAT/uppdatera.sh"
          test "$(sudo stat -c '%a %U' "$KAT/uppdatera.sh")" = "700 root"
          test "$(systemctl is-enabled "$ENHET.timer")" = enabled
          test "$(systemctl is-active "$ENHET.timer")" = active
          grep -qxF "ExecStart=/bin/bash $KAT/uppdatera.sh --tidsstyrd" "/etc/systemd/system/$ENHET.service"
          sudo systemd-analyze verify "/etc/systemd/system/$ENHET.service" "/etc/systemd/system/$ENHET.timer"
          # Provet kör tjänsten själv: timern stoppas så att den inte startar en kontroll mitt i, och
          # tjänsten får lokala avbilder och kortare väntan.
          sudo systemctl stop "$ENHET.timer"
          sudo mkdir -p "/etc/systemd/system/$ENHET.service.d"
          printf '[Service]\nEnvironment=TRANSCRIBE_PULL=0\nEnvironment=TRANSCRIBE_VANTA=120\n' \
            | sudo tee "/etc/systemd/system/$ENHET.service.d/prov.conf" >/dev/null
          sudo systemctl daemon-reload

          # Ett konto skapas med en inbjudan, som en användare gör.
          token="$(docker exec transcribe node dist/cli.js inbjudan admin | grep -oE '/#/inbjudan/[A-Za-z0-9_-]+' | sed 's|.*/||')"
          docker exec -e PW="$PW" -e TOKEN="$token" transcribe node -e 'fetch("http://127.0.0.1:8080/api/invites/" + process.env.TOKEN, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: "ci@example.com", password: process.env.PW }) }).then(async (r) => { if (!r.ok) { console.error(r.status, await r.text()); process.exit(1); } })'
          test "$(logga_in)" = 200

          # 2) Ingen ny version: ingenting händer, ingen omstart.
          fore="$(startad)"
          kor_tjansten
          test "$(startad)" = "$fore"
          logg | grep -F "Ingen ny version (kör 900.0.0, erbjuds 900.0.0)."
          sudo journalctl -u "$ENHET.service" --no-pager | grep -F "Ingen ny version"

          # 3) Ny version: säkerhetskopia, uppgradering, frisk på rätt version, kontot finns kvar.
          erbjud 900.1.0
          kor_tjansten
          frisk_pa 900.1.0
          test "$(logga_in)" = 200
          sudo sh -c "test -f $KAT/kopior/*-900.0.0/transcribe.db"
          test "$(sudo stat -c '%a %U' "$KAT/kopior")" = "700 root"
          sudo grep -qx "TRANSCRIBE_VERSION=900.1.0" "$KAT/.env"
          sudo grep -qx "TRANSCRIBE_IMAGE=$B" "$KAT/.env"
          logg | grep -F "Klart: SMGD Transkribering 900.1.0 är igång och frisk."
          sudo test ! -e "$KAT/pagaende-uppgradering"
          # docker compose för hand ger samma version (den står i .env).
          (cd "$KAT" && sudo docker compose config --images) | grep -qx "$B:900.1.0"

          # 4) Avbrott: tjänsten dödas medan den nya versionen startar (som ett strömavbrott för
          #    skriptet). Markeringen ligger kvar, och nästa körning gör klart: den nya blir frisk.
          erbjud 900.2.0
          sudo systemctl start --no-block "$ENHET.service"
          # Avbrottet görs när den nya containern verkligen kör (inte bara är skapad).
          for _ in $(seq 1 120); do [ "$(version)" = 900.2.0 ] && [ "$(kor)" = true ] && break; sleep 1; done
          test "$(version)" = 900.2.0
          test "$(kor)" = true
          test "$(halsa)" != healthy
          test "$(tjanstens_lage)" = activating
          sudo systemctl kill --signal=KILL "$ENHET.service"
          for _ in $(seq 1 30); do [ "$(tjanstens_lage)" != activating ] && break; sleep 1; done
          sudo grep -qx "fas=provar" "$KAT/pagaende-uppgradering"
          kor_tjansten
          frisk_pa 900.2.0
          sudo test ! -e "$KAT/pagaende-uppgradering"
          logg | grep -F "Den nya versionen 900.2.0 blev frisk – uppgraderingen gjordes klar."
          test "$(logga_in)" = 200

          # 5) Trasig version: återgång till 900.2.0 med databasen från före försöket.
          erbjud 900.3.0
          if kor_tjansten; then echo "Tjänsten lyckades trots en trasig version" >&2; exit 1; fi
          frisk_pa 900.2.0
          test "$(logga_in)" = 200
          sudo grep -qx "misslyckad_version=900.3.0" "$KAT/lage.txt"
          sudo grep -qx "TRANSCRIBE_VERSION=900.2.0" "$KAT/.env"
          logg | grep -F "Återgick till 900.2.0 med databasen från före försöket."
          # … och samma version prövas inte igen.
          fore="$(startad)"
          kor_tjansten
          test "$(startad)" = "$fore"
          logg | grep -F "Version 900.3.0 fungerade inte förra gången – försöker inte igen (kör 900.2.0)."

          # 6) Avbrott medan en version som aldrig blir frisk provas: nästa körning ger den chansen,
          #    går sedan tillbaka och lägger tillbaka databasen.
          erbjud 900.4.0
          sudo systemctl start --no-block "$ENHET.service"
          for _ in $(seq 1 120); do [ "$(version)" = 900.4.0 ] && [ "$(kor)" = true ] && break; sleep 1; done
          test "$(version)" = 900.4.0
          test "$(kor)" = true
          sudo systemctl kill --signal=KILL "$ENHET.service"
          for _ in $(seq 1 30); do [ "$(tjanstens_lage)" != activating ] && break; sleep 1; done
          sudo grep -qx "fas=provar" "$KAT/pagaende-uppgradering"
          kor_tjansten
          frisk_pa 900.2.0
          test "$(logga_in)" = 200
          sudo test ! -e "$KAT/pagaende-uppgradering"
          sudo grep -qx "misslyckad_version=900.4.0" "$KAT/lage.txt"

          # 7) Läget i klartext.
          sudo systemctl start "$ENHET.timer"
          uppdatera --lage | tee "$RUNNER_TEMP/transcribe-lage.txt"
          grep -F "Automatisk uppdatering:  på (letar efter en ny version" "$RUNNER_TEMP/transcribe-lage.txt"
          grep -F "Kör version:             900.2.0 (igång och frisk)" "$RUNNER_TEMP/transcribe-lage.txt"
          grep -F "Hoppar över version:     900.4.0" "$RUNNER_TEMP/transcribe-lage.txt"
          grep -F "Säkerhetskopior:" "$RUNNER_TEMP/transcribe-lage.txt"

          # 8) Lås: medan en annan körning håller låset gör tjänsten ingenting.
          sudo flock /run/transcribe-uppdatering.lock systemctl start "$ENHET.service"
          logg | grep -F "pågår redan – den här kontrollen hoppas över"

          # 9) Raden en gång till: ingen ny version, ingen omstart, timern kvar.
          erbjud 900.2.0
          fore="$(startad)"
          installera
          test "$(startad)" = "$fore"
          test "$(systemctl is-active "$ENHET.timer")" = active
          if sudo grep -q "^misslyckad_version=" "$KAT/lage.txt"; then echo "Raden glömde inte den misslyckade versionen" >&2; exit 1; fi

          # Inget lösenord i loggen, läget eller journalen.
          if sudo grep -rF "$PW" "$KAT/uppdatering.log" "$KAT/lage.txt" >/dev/null 2>&1 \
            || sudo journalctl -u "$ENHET.service" --no-pager | grep -F "$PW" >/dev/null; then
            echo "Ett lösenord finns i uppdateringens filer eller i journalen" >&2; exit 1
          fi

          # 10) Slå av: timern och tjänsten är borta, transkriberingen kör vidare.
          installera --utan-automatisk-uppdatering
          test ! -e "/etc/systemd/system/$ENHET.timer"
          test ! -e "/etc/systemd/system/$ENHET.service"
          if systemctl list-timers --all --no-legend | grep -F "$ENHET" >/dev/null; then echo "Timern finns kvar" >&2; exit 1; fi
          frisk_pa 900.2.0
          uppdatera --lage | grep -F "Automatisk uppdatering:  av"

      - name: Egen server – loggar vid fel
        if: failure()
        run: |
          sudo cat "$RUNNER_TEMP/transcribe-idag/uppdatering.log" 2>/dev/null || true
          sudo cat "$RUNNER_TEMP/transcribe-server/uppdatering.log" 2>/dev/null || true
          sudo cat "$RUNNER_TEMP/transcribe-server/lage.txt" 2>/dev/null || true
          sudo journalctl -u transcribe-uppdatering.service --no-pager -n 200 2>/dev/null || true
          systemctl status transcribe-uppdatering.timer transcribe-uppdatering.service --no-pager 2>/dev/null || true
          docker inspect -f '{{.Name}} {{.Config.Image}} {{.State.Status}} kod={{.State.ExitCode}}' transcribe 2>/dev/null || true
          docker logs --tail 100 transcribe 2>&1 || true

      - name: Egen server – städa
        if: always()
        run: |
          sudo systemctl disable --now transcribe-uppdatering.timer >/dev/null 2>&1 || true
          sudo rm -rf /etc/systemd/system/transcribe-uppdatering.timer /etc/systemd/system/transcribe-uppdatering.service \
            /etc/systemd/system/transcribe-uppdatering.service.d
          sudo systemctl daemon-reload || true
          docker rm -f transcribe >/dev/null 2>&1 || true
          docker volume rm transcribe_transcribe-data >/dev/null 2>&1 || true
          sudo rm -rf "$RUNNER_TEMP/transcribe-server" "$RUNNER_TEMP/transcribe-kalla" "$RUNNER_TEMP/transcribe-lage.txt" \
            "$RUNNER_TEMP/transcribe-idag" "$RUNNER_TEMP/transcribe-idag-kalla" "$RUNNER_TEMP/transcribe-1.0.0"

      - name: Logga in på GHCR
        # Standardgrenen (repot har ingen gren som heter main; samma villkor som i addon.yml).
        if: github.ref == 'refs/heads/main' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Finns versionen redan?
        id: finns
        if: github.ref == 'refs/heads/main' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # En utgiven version ändras aldrig i efterhand. Bara ett uttryckligt "taggen finns inte"
          # ger publicering; varje annat fel (nätverk, behörighet, GHCR nere) avbryter jobbet.
          if utskrift="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)"; then
            echo "::notice::$IMAGE:$VERSION finns redan – höj versionen i package.json för att ge ut en ny. (latest kontrolleras ändå nedan.)"
            echo "finns=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$utskrift" | grep -qiE 'manifest unknown|: not found'; then
            echo "$IMAGE:$VERSION finns inte än – publiceras."
            echo "finns=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$utskrift" >&2
            echo "::error::Kunde inte avgöra om $IMAGE:$VERSION redan finns. Inget publiceras."
            exit 1
          fi
      - name: Publicera versionen
        # Standardgrenen, och bara en version som inte redan finns.
        if: (github.ref == 'refs/heads/main' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && steps.finns.outputs.finns == 'false'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker tag transcribe:ci "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
      - name: Flytta latest till versionen (om den är högre)
        # Körs också när versionen redan fanns: misslyckades flytten förra gången (GHCR nere, avbrutet
        # jobb) görs den nu. latest flyttas aldrig till en lägre version, och inget byggs om – latest
        # blir exakt den avbild som redan är utgiven under sitt versionsnummer.
        if: github.ref == 'refs/heads/main' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          version_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$VERSION")"
          fel="$RUNNER_TEMP/latest-fel.txt"
          if latest_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:latest" 2>"$fel")"; then
            if [ "$latest_digest" = "$version_digest" ]; then
              echo "latest är redan $VERSION."
              exit 0
            fi
            docker pull -q "$IMAGE:latest" >/dev/null
            latest_version="$(docker image inspect -f '{{with .Config.Labels}}{{index . "org.opencontainers.image.version"}}{{end}}' "$IMAGE:latest" | sed 's/<no value>//')"
            # En latest utan giltig etikett (1.0.0) räknas som lägre än varje utgiven version.
            hogst="$(printf '%s\n%s\n' "$latest_version" "$VERSION" | sort -V | tail -n 1)"
            if [[ "$latest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && { [ "$hogst" != "$VERSION" ] || [ "$latest_version" = "$VERSION" ]; }; then
              echo "::notice::latest är $latest_version – inte lägre än $VERSION, så den flyttas inte."
              exit 0
            fi
            echo "latest flyttas från ${latest_version:-en version utan etikett} till $VERSION."
          elif grep -qiE 'manifest unknown|: not found' "$fel"; then
            echo "latest finns inte än – sätts till $VERSION."
          else
            cat "$fel" >&2
            echo "::error::Kunde inte läsa $IMAGE:latest. latest lämnas som den är."
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"
