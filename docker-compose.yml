# SMGD DriveLog – komplett driftmiljö.
# Starta:  cp .env.example .env  (fyll i värdena)  &&  docker compose up -d
name: drivelog

x-backend: &backend
  build: ./backend
  image: smgd-drivelog-backend:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DRIVELOG_ENVIRONMENT: production
    DRIVELOG_DATABASE_URL: postgresql://drivelog:${POSTGRES_PASSWORD}@db:5432/drivelog
    DRIVELOG_REDIS_URL: redis://redis:6379/0
    DRIVELOG_DATA_DIR: /data
  volumes:
    - drivelog-data:/data
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: drivelog
      POSTGRES_USER: drivelog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sätt POSTGRES_PASSWORD i .env}
    volumes:
      - drivelog-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivelog -d drivelog"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - drivelog-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *backend
    command: ["api"]

  worker:
    <<: *backend
    command: ["worker"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app:celery inspect ping -d celery@$$HOSTNAME >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 40s
    depends_on:
      api:
        condition: service_healthy

  beat:
    <<: *backend
    command: ["beat"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    image: smgd-drivelog-web:latest
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DRIVELOG_DOMAIN: ${DRIVELOG_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  drivelog-db:
  drivelog-redis:
  drivelog-data:
  caddy-data:
  caddy-config:
