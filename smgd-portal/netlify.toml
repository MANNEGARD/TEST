# smgd.se – inloggning och portal till subdomänerna.
# Sidorna "/" och "/api/*" hanteras av edge-funktionerna i netlify/edge-functions/.

[build]
  publish = "public"
  edge_functions = "netlify/edge-functions"
  command = "echo 'Inget byggsteg'"

# Säkerhetshuvuden för de statiska filerna (CSS, JS, bilder). Edge-funktionerna sätter
# sina egna huvuden, eftersom Netlifys Custom Headers inte gäller för dem.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Allt som inte finns ger 404 – inga gamla sökvägar ska leda någonstans.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
