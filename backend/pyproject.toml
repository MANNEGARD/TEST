[project]
name = "smgd-drivelog-backend"
version = "1.0.0"
description = "SMGD DriveLog – intelligent körjournal (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.4",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "XlsxWriter>=3.2",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "python-multipart>=0.0.12",
    "tzdata>=2024.2",
    "anthropic>=2.0",
    "icalendar>=6.1",
    "recurring-ical-events>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.7",
    "time-machine>=2.16",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
